name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This repo is two packages of the MemoryOverEth workspace. CI assembles a
# workspace containing both so `@limccn/menhir-core` resolves as `workspace:*` from the
# contracts project, exactly as it does locally.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/menhir
      - name: Checkout longstone lockfile ledger
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone
          token: ${{ github.token }}
          path: ci

      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "menhir/ts"\n  - "menhir/contracts"\nallowBuilds:\n  "esbuild": true\n  "sharp": true\n  "workerd": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The lockfile is the reviewed ledger in longstone/ci/lockfiles. A
      # missing or stale ledger fails the job; there is no non-frozen fallback.
      - name: Install from reviewed lockfile
        working-directory: workspace
        run: |
          cp ../ci/ci/lockfiles/menhir-ci.yaml pnpm-lock.yaml
          pnpm install --frozen-lockfile

      # The library first: the contract suite consumes its committed corpus.
      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core test
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core typecheck
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core check:browser
        working-directory: workspace

      - run: pnpm --filter @limccn/menhir-contracts test
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-contracts typecheck
        working-directory: workspace

      # The vector corpus is a contract between repos; regenerating it must not
      # change a byte.
      - name: Vectors are reproducible
        working-directory: workspace
        run: |
          pnpm --filter @limccn/menhir-core generate:vectors
          git -C menhir diff --exit-code -- ts/test/vectors
